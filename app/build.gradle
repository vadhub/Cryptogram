plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

def debugStoreFile = rootProject.file("/home/vadim/Desktop/apps/cryptogram/cert/cryptogram.jks")
def debugPropsFile = rootProject.file("/home/vadim/Desktop/apps/cryptogram/cert/release.properties")
def debugProps = new Properties()

debugPropsFile.withInputStream { stream ->
    debugProps.load(stream)
}

android {
    namespace 'com.abg.cryptogram'
    compileSdk 34

    defaultConfig {
        applicationId "com.abg.cryptogram"
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName "1.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        signingConfigs {
            debug {
                storeFile debugStoreFile
                keyAlias debugProps.getProperty("key_alias")
                keyPassword debugProps.getProperty("key_password")
                storePassword debugProps.getProperty("store_password")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled true
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'com.yandex.android:mobileads:7.5.0'
    implementation "androidx.fragment:fragment-ktx:1.8.2"

    implementation "ru.rustore.sdk:billingclient:6.1.0"

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}